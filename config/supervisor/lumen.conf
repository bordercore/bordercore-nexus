; Install alongside gunicorn after migrations, with the same server credentials.
[program:lumen]
command=/var/www/django/bordercore/.venv/bin/python /var/www/django/bordercore/manage.py run_lumen_worker
directory=/var/www/django/bordercore
user=www-data
environment=DJANGO_SETTINGS_MODULE="config.settings.prod",PYTHONPATH="/var/www/django/bordercore:/var/www/django/bordercore/bordercore",LUMEN_GENERATION_ENABLED="true"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=920
stdout_logfile=/var/log/django/lumen.log
redirect_stderr=true
